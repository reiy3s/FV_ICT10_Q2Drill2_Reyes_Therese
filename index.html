<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <title> Drill 2 🐍 </title>

    <style>

        #form-div{
            text-align: center;
            color: rgb(239, 232, 250);
            background-color: #51405b;
            width: min(90vw, 500px);
            border-radius: 10px;
            border: 3px solid #170b1d;
            box-sizing: border-box;
            padding: 20px;
        }

        #output-div{
            text-align: center;
            color: rgb(239, 232, 250);
            background-color: #51405b;
            width: min(90vw, 500px);
            border-radius: 10px;
            border: 3px solid #170b1d;
            box-sizing: border-box;
            padding: 20px;
        }

        #members-list{
            list-style-position: inside;
            padding-left: 0;
        }

        body{
            min-height: 95vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #dcd2f7;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        input[type="text"]{
            width: min(100%, 300px);
            height: 30px;
            display: block;
            margin: 0 auto;
            box-sizing: border-box;
        }

        #members-list li{
            text-align: left;
        }

    </style>

</head>
<body>

    <div>
        <h1> La Creekalena Club </h1>
        <h3> Add Club Member </h3>

            <div id="form-div">
                <form>
                    <h3> Join !! </h3>
                    <input type="text" name="fn" id="fn" placeholder="Enter your first name here..." class="form-control">

                    <br>

                    <input type="text" name="ln" id="ln" placeholder="Enter your last name here..." class="form-control">

                    <br>

                    <i><div id="display"></div></i><br>

                    <button type="button" py-click="add_member">Add Member</button>
                </form>
            </div>

    </div>

    <br><br>

    <div id="output-div">
        <h3> Club Members </h3>
        <ul id="members-list"></ul>
    </div>

    <script type="py" src="main.py"></script>
  
</body>
</html>
